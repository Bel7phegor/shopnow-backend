name: CI/CD pipeline dev

on: 
  push: 
    branches: ["develop"]

env:
  AWS_REGION: ap-southeast-3

permissions:
  id-token: write
  contents: read

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            config-server: 'config-server/**'
            product-service: 'product-service/**'
            shopping-cart-service: 'shopping-cart-service/**'
            user-service: 'user-service/**'

  build:
    name: Build & Push
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.ROLE_ACCESS }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
      
      - name: Build and push ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          
          docker build \
            --network=host \
            -t ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.service }}:${{ github.sha }} \
            .
            
          docker push ${{ secrets.ECR_REGISTRY }}
          /${{ matrix.service }}:dev_${{ github.sha }}