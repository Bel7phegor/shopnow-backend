name: CI/CD — Development

on: 
  push: 
    branches: ["develop"]

env:
  AWS_REGION: ap-southeast-3

permissions:
  id-token: write
  contents: read

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            config-server: 'config-server/**'
            product-service: 'product-service/**'
            shopping-cart-service: 'shopping-cart-service/**'
            user-service: 'user-service/**'
            discovery-server: 'discovery-server/**'

  build:
    name: Build & Push
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.ROLE_ACCESS }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
      
      - name: Build and push ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          
          docker build \
            --network=host \
            -t ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.service }}:${{ github.sha }} \
            .
            
          docker push ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.service }}:${{ github.sha }}
  
  deploy: 
    name: Deploy to AWS EC2
    runs-on: [self-hosted, be-runner-dev]
    needs: [detect-changes, build]
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    environment: development
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    
    env:
      PORT_API_GATEWAY: ${{ secrets.PORT_API_GATEWAY }}
      PORT_CONFIG_SERVER: ${{ secrets.PORT_CONFIG_SERVER }}
      PORT_DISCOVERY_SERVER: ${{ secrets.PORT_DISCOVERY_SERVER }}
      PORT_PRODUCT_SERVICE: ${{ secrets.PORT_PRODUCT_SERVICE }}
      PORT_SHOPPING_CART_SERVICE: ${{ secrets.PORT_SHOPPING_CART_SERVICE }}
      PORT_USER_SERVICE: ${{ secrets.PORT_USER_SERVICE }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.ROLE_ACCESS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Dynamic Port Mapping from Secrets
        id: set-port
        run: |
          SERVICE_CONVERTED=$(echo "${{ matrix.service }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          
          VAR_NAME="PORT_${SERVICE_CONVERTED}"
          
          PORT_VAL="${!VAR_NAME}"
          
          if [ -z "$PORT_VAL" ]; then
            echo "Warning: Secret $VAR_NAME is not set, defaulting to port 80"
            PORT_VAL="80"
          fi
          
          echo "PORT_MAPPING=${PORT_VAL}:${PORT_VAL}" >> $GITHUB_ENV

      - name: Deploy ${{ matrix.service }} on AWS with CloudWatch Logs
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          
          docker stop ${{ matrix.service }} || true
          docker rm ${{ matrix.service }} || true
          
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.service }}:${{ github.sha }}
          
          # Sử dụng biến port động đã bốc từ Secret ra thành công ở trên
          docker run -d -p ${{ env.PORT_MAPPING }} \
            --name ${{ matrix.service }} \
            --restart unless-stopped \
            --log-driver=awslogs \
            --log-opt awslogs-region=${{ env.AWS_REGION }} \
            --log-opt awslogs-group=/ec2/${{ matrix.service }} \
            --log-opt awslogs-create-group=true \
            ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.service }}:${{ github.sha }}