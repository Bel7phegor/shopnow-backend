global:
  appName: "shopnow-shopping-cart-service" # Khớp với tên do Matrix của GitHub Actions sinh ra
  namespace: "shopnow"
  enabledComponents:
    configmap: true
    service: true
    ingress: true
  
image:
  pullSecret: "shopnow-registry-secret"

service:
  type: ClusterIP
  port: 5863
  targetPort: 5863

ingress:
  className: "nginx"
  host: "cart-service-shopnow.anphuc.site"
  path: "/"
  pathType: Prefix

configmap:
  data:
    application.properties: |
      spring.application.name=cart-service
      server.port=5863

      eureka.instance.hostname=cart-service
      eureka.instance.instance-id=${spring.application.name}
      eureka.client.service-url.defaultZone=http://shopnow-discovery-server-service:8761/eureka/

      spring.datasource.url=jdbc:postgresql://postgres:5432/postgres?useSSL=false
      spring.datasource.username=postgres
      spring.datasource.password=admin
      spring.jpa.hibernate.ddl-auto=update
      spring.jpa.show-sql=true
      spring.jpa.properties.hibernate.format_sql=true